# TCP (grasp-point) waypoints for the two-arm color-sorting cell, planning_frame = world.
# Shared grasp model is identical to the single-arm cell (crx_pick_place_waypoints.yaml): the
# node computes IK for each arm's flange at TCP.z + flange_tcp_offset, tool pointing straight
# DOWN and twisted so the jaws straddle the part along world Y (clear of the gate barrier).
# Both arms have identical local geometry, so the green arm's world waypoints are the blue
# arm's shifted +1.0 m in X (green base is mounted at world x=1.0).
planning_frame: world
flange_tcp_offset: 0.1208
orientation: {x: 0.50774, y: 0.49218, z: -0.50622, w: 0.49371}

move_time: 4.0
grip_time: 2.0

# home joint configuration (rad), generic joint keys (the arm prepends its blue_/green_ prefix).
home: {J1: 0.0, J2: 0.0, J3: 0.0, J4: 0.0, J5: -1.5708, J6: 0.0}

gripper:
  open: 0.0
  closed: 0.043

# Per-arm TCP world positions.
blue:   # station A (x=0.43), place into blue_box at world (0, -0.65)
  pick_approach:  {x: 0.43, y: 0.35, z: 0.72}
  pick:           {x: 0.43, y: 0.35, z: 0.53}
  lift:           {x: 0.43, y: 0.35, z: 0.72}
  place_approach: {x: 0.00, y: -0.65, z: 0.80}
  place:          {x: 0.00, y: -0.65, z: 0.62}

green:  # station B (x=1.43), place into green_box at world (1.0, -0.65)
  pick_approach:  {x: 1.43, y: 0.35, z: 0.72}
  pick:           {x: 1.43, y: 0.35, z: 0.53}
  lift:           {x: 1.43, y: 0.35, z: 0.72}
  place_approach: {x: 1.00, y: -0.65, z: 0.80}
  place:          {x: 1.00, y: -0.65, z: 0.62}
