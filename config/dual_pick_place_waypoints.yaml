# TCP (grasp-point) waypoints for the two-arm color-sorting cell, planning_frame = world.
# Shared grasp model is identical to the single-arm cell (crx_pick_place_waypoints.yaml): the
# node computes IK for each arm's flange at TCP.z + flange_tcp_offset, tool pointing straight
# DOWN and twisted so the jaws straddle the part along world Y (clear of the gate barrier).
# Both arms have identical local geometry, so the green arm's world waypoints are the blue
# arm's shifted +1.0 m in X (green base is mounted at world x=1.0).
planning_frame: world
flange_tcp_offset: 0.1208
orientation: {x: 0.50774, y: 0.49218, z: -0.50622, w: 0.49371}

move_time: 1.5     # seconds per arm move (grasp verified reliable at this speed)
grip_time: 2.0     # seconds per gripper move (needs time to close firmly before the lift)

# home joint configuration (rad), generic joint keys (the arm prepends its blue_/green_ prefix).
home: {J1: 0.0, J2: 0.0, J3: 0.0, J4: 0.0, J5: -1.5708, J6: 0.0}

gripper:
  open: 0.0
  closed: 0.043

# Per-arm TCP world positions.
blue:   # station A (x=0.43), place into blue_box at world (0, -0.65)
  pick_approach:  {x: 0.43, y: 0.35, z: 0.72}
  pick:           {x: 0.43, y: 0.35, z: 0.53}
  lift:           {x: 0.43, y: 0.35, z: 0.72}
  place_approach: {x: 0.00, y: -0.65, z: 0.80}
  place:          {x: 0.00, y: -0.65, z: 0.62}

green:  # station B (x=1.43), place into green_box at world (1.0, -0.65)
  pick_approach:  {x: 1.43, y: 0.35, z: 0.72}
  pick:           {x: 1.43, y: 0.35, z: 0.53}
  lift:           {x: 1.43, y: 0.35, z: 0.72}
  place_approach: {x: 1.00, y: -0.65, z: 0.80}
  place:          {x: 1.00, y: -0.65, z: 0.62}

# On-the-fly interception for the green arm at station B (belt keeps running). All x are world;
# y is the belt centerline (0.35). The part is released from gate B (~1.43) and glides -X. The arm
# waits above x_intercept and, when the LIVE part x drops to x_intercept, flies a pre-computed
# velocity-matched trajectory: co-move -X at match_speed while descending to z_grasp, hold (gripper
# closes), lift. Tune match_speed to the part's OBSERVED speed at the intercept and nudge
# x_intercept until the 4 cm cube is caught reliably (this is the main tuning knob).
green_intercept:
  y:            0.35
  x_intercept:  1.30    # arm waits above this; fire when live part x <= it; co-move starts here
  z_approach:   0.72    # pre-position / lift height
  z_grasp:      0.53    # grasp height (same as the static pick)
  descend_time: 1.2     # s: co-move while descending z_approach -> z_grasp
  grasp_time:   1.6     # s: co-move at z_grasp (gripper closes early, then a firm-grip dwell before lift)
  lift_time:    1.0     # s: co-move while lifting z_grasp -> z_approach
  belt_crawl:   -0.06   # belt speed during the grasp: the belt keeps MOVING but crawls (wide window)
  match_speed:  0.10    # m/s: co-move speed matched to the part's MEASURED speed at the intercept (~0.10)
  fire_latency: 0.1     # s: build+send delay (measured: build ~0.01s) -> predict part forward this much
